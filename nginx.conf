  # Never log request arguments: auth links carry single-use verification tokens.
  # Keep useful request telemetry while excluding query strings and referrers.
  log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  access_log /var/log/nginx/access.log safe;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
}
